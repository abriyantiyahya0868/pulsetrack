<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register — PulseTrack Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d2c46 0%, #1b4b72 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }

        .auth-header {
            background: #0d3b66;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .auth-header span {
            color: #38bdf8;
        }

        .auth-header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .auth-body {
            padding: 28px 24px;
        }

        .tab-switch {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13.5px;
            font-weight: 700;
            color: #64748b;
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #0284c7;
            border-bottom-color: #0284c7;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }

        .btn-submit {
            width: 100%;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #0369a1;
        }

        .alert-box {
            padding: 10px;
            border-radius: 4px;
            font-size: 12.5px;
            margin-bottom: 14px;
            display: none;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h1>⚡ Pulse<span>Track</span></h1>
        </div>

        <div class="auth-body">
            <div class="tab-switch">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register New Account</button>
            </div>

            <div id="alertMsg" class="alert-box"></div>

            <form id="authForm">
                <div class="form-group" id="groupName" style="display:none;">
                    <label for="userName">Full Name:</label>
                    <input type="text" id="userName" class="form-input" placeholder="e.g. John Doe">
                </div>

                <div class="form-group">
                    <label for="userEmail">Email / Username: *</label>
                    <input type="email" id="userEmail" class="form-input" placeholder="name@email.com" required>
                </div>

                <div class="form-group">
                    <label for="userPassword">Password: *</label>
                    <input type="password" id="userPassword" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">Log In to PulseTrack</button>
            </form>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const groupName = document.getElementById('groupName');
            const btnSubmit = document.getElementById('btnSubmit');
            const alertMsg = document.getElementById('alertMsg');

            alertMsg.style.display = 'none';

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                groupName.style.display = 'none';
                btnSubmit.textContent = 'Log In to PulseTrack';
            } else {
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
                groupName.style.display = 'block';
                btnSubmit.textContent = 'Create Account & Open Panel';
            }
        }

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim() || 'abriyantiyahya0868@gmail.com';
            const userObj = { id: 'usr_admin', email: email, name: email.split('@')[0] || 'Admin' };
            const tokenStr = btoa(JSON.stringify({ userId: userObj.id, email: userObj.email, exp: Date.now() + 365*24*3600*1000 }));

            localStorage.setItem('pulse_auth_token', tokenStr);
            localStorage.setItem('pulse_user_info', JSON.stringify(userObj));
            
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.className = 'alert-box alert-success';
            alertMsg.textContent = '✅ Berhasil! Mengalihkan ke panel...';
            alertMsg.style.display = 'block';

            window.location.href = '/index.html';
        });
                alertMsg.className = 'alert-box alert-error';
                alertMsg.textContent = '❌ Terjadi kesalahan koneksi: ' + err.message;
                alertMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = currentMode === 'login' ? 'Log In to PulseTrack' : 'Create Account & Open Panel';
            }
        });
    </script>
</body>
</html>
