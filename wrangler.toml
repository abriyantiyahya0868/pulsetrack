name = "pulsetrack"
compatibility_date = "2024-04-01"
pages_build_output_dir = "public"

# Cloudflare D1 Database Binding
# Ganti database_name dan database_id sesuai yang Anda buat di Cloudflare Dashboard
[[d1_databases]]
binding = "DB"
database_name = "pulsetrack_db"
database_id = "YOUR_D1_DATABASE_ID_HERE"
